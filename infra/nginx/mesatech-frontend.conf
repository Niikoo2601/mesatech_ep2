# Frontend React de MesaTech, servido en la EC2 BFF (puerto 80).
# El API Gateway reenvia aqui todo lo que no sea /v1 o /v2.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/mesatech;
    index index.html;

    # Rutas de API no publicadas: 404 real (no index.html)
    location ~ ^/(v1|v2|api)(/|$) {
        default_type application/json;
        return 404 '{"message":"Not Found"}';
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
