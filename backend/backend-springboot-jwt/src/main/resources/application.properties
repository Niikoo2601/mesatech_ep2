spring.application.name=api-cloud-native

server.port=${SERVER_PORT:8080}
# Id. de directorio (inquilino)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/c2154212-c473-414a-9f88-8860491a518c/v2.0

# Desde Exponer API: Ámbitos definidos por esta API
spring.security.oauth2.resourceserver.jwt.audiences=3cbc0426-09ed-4e59-b1ff-60981daa8762

