# ============================================================
# Microservicio Solicitudes (CONSUMIDOR) - EC2 B
# Todos los valores sensibles se entregan por variables de entorno
# (ver .env.example). No escribir contraseñas en este archivo.
# ============================================================
spring.application.name=microservicio-solicitudes
server.port=${SERVER_PORT:8081}

# ---------- RDS Solicitudes (instancia exclusiva) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- RabbitMQ (EC2 C, IP privada) ----------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=5s

# ack AUTO: Spring confirma el mensaje solo cuando el listener termina sin error
# (después de guardar en RDS). Si falla, no hay ack y el mensaje vuelve a la cola.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true
spring.rabbitmq.listener.simple.prefetch=1
# Si la cola no existe, el servicio arranca igual y reintenta (la cola la crea el administrador)
spring.rabbitmq.listener.simple.missing-queues-fatal=false

mesatech.mensajeria.cola=${RABBITMQ_QUEUE:solicitudes.catalogo.queue}

# ---------- Salud del servicio ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
