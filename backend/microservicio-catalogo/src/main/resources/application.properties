# ============================================================
# Microservicio Catálogo (PUBLICADOR) - EC2 A
# Todos los valores sensibles se entregan por variables de entorno
# (ver .env.example). No escribir contraseñas en este archivo.
# ============================================================
spring.application.name=microservicio-catalogo
server.port=${SERVER_PORT:8082}

# ---------- RDS Catálogo (instancia exclusiva) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- RabbitMQ (EC2 C, IP privada) ----------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=5s

# Confirmaciones del broker (ack/nack) y retorno de mensajes sin ruta
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos de mensajería (creados por infra/rabbitmq/configurar-recursos.sh)
mesatech.mensajeria.exchange=${RABBITMQ_EXCHANGE:catalogo.exchange}
mesatech.mensajeria.routing-key=${RABBITMQ_ROUTING_KEY:categoria.creada}
mesatech.mensajeria.timeout-confirmacion=5s

# ---------- Salud del servicio ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
